  <!-- Scoped styles ONLY for the new right-side details panel.
       All class names are prefixed with "sl-" to avoid collisions. -->
  <style>
    :root {
      --sl-ink: #fffffff1;
      --sl-muted: #ffffffd0;
      --sl-panel: #304ca0;
      --sl-divider: #e9ecef;
      --sl-accent: #78b657;
      --sl-accent-ink: #ffffff;
      --sl-price: #78b657;
      --sl-radius: 16px;
      --sl-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    /* Right panel container */
    .sl-details-card {
      background: var(--sl-panel);
	  border-top-left-radius: var(--sl-radius);
      border-top-right-radius: var(--sl-radius);
      box-shadow: var(--sl-shadow);
      padding: 20px;
      overflow: hidden;
    }

    /* Title / subtitle / price */
    .sl-title {
      margin: 0 0 2px 0;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.25;
      color: var(--sl-ink);
    }

    .sl-subtitle {
      margin: 0 0 16px 0;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--sl-muted);
      font-weight: 700;
      letter-spacing: .3px;
    }

    .sl-price {
      margin: 4px 0 8px 0;
      font-weight: 900;
      font-size: 22px;
      color: var(--sl-price);
    }

    .sl-lead {
      color: var(--sl-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .sl-divider {
      width: 100%;
      height: 1px;
      background: var(--sl-divider);
      margin: 18px 0;
    }

    /* Description & sections */
    .sl-section-title {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--sl-ink);
    }

    .sl-paragraph {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: var(--sl-ink);
    }

    /* Swatches */
    .sl-swatches {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 14px 0;
    }
    .sl-swatch {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid transparent;
      outline: 1px solid rgba(0,0,0,0.08);
      background: #ddd;
      cursor: pointer;
      transition: transform .1s ease, border-color .1s ease, outline-color .1s ease;
    }
    .sl-swatch:hover { transform: translateY(-1px); }
    .sl-swatch[aria-checked="true"] {
      border-color: var(--sl-accent);
      outline-color: var(--sl-accent);
    }
    .sl-note {
      font-size: 12px;
      color: var(--sl-muted);
      margin: 4px 0 0 0;
    }

    /* Buttons */
    .sl-actions {
      display: grid;
      grid-template-columns: 1fr;
      grid-gap: 0;
      margin-top: 0;
    }

    .sl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--sl-divider);
      font-weight: 800;
      cursor: pointer;
      transition: transform .1s ease, filter .1s ease, box-shadow .1s ease;
      text-align: center;
    }
    .sl-btn:active { transform: translateY(1px); }

    .sl-btn-primary {
      background: var(--sl-accent);
      color: var(--sl-accent-ink);
      border: none;
      box-shadow: 0 6px 18px rgba(34,108,59,0.25);
    }

    .sl-btn-ghost {
      background: transparent;
      color: var(--sl-ink);
    }

    .sl-actions {
      display: grid;
      justify-items: center;   /* horizontal centering */
    }

    #slBuyButtonHost .shopify-buy__btn {
      width: auto;             /* was 100% */
      min-width: 220px;        /* optional: keep a nice size */
    }

    /* Make sure the right card looks good on narrow screens too */
    @media (max-width: 576px) {
      #card-two { width: 100% !important; }
    }
  </style>

     <script>
       (function() {
         "use strict";

         // Explicit variable declarations for all elements we touch.
         var slSwatchButtons = document.querySelectorAll(".sl-swatch");
         var slSwatchActiveLabel = document.getElementById("slSwatchActiveLabel");

         // Defensive checks (elements exist before binding).
         if (slSwatchButtons && slSwatchButtons.length > 0 && slSwatchActiveLabel) {
           for (var i = 0; i < slSwatchButtons.length; i++) {
             (function(btn) {
               btn.addEventListener("click", function() {
                 // Uncheck all
                 for (var j = 0; j < slSwatchButtons.length; j++) {
                   slSwatchButtons[j].setAttribute("aria-checked", "false");
                 }
                 // Check current
                 btn.setAttribute("aria-checked", "true");
                 var selected = btn.getAttribute("data-color") || "Selected";
                 slSwatchActiveLabel.textContent = "Selected: " + selected;
               });
             })(slSwatchButtons[i]);
           }
         }
       })();
